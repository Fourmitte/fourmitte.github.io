<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map S3</title>
  <style>
    :root {
      --panel-bg: #fff;
      --panel-border: #1f2937;
      --muted: #4b5563;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; }

    /* Coordonnées sous la souris (contrôle Google en haut au centre) */
    #coords {
      font-size: 130%;
      background: #000;
      color: #fff;
      padding: 5px 8px;
      margin-top: 10px;
      border-radius: 4px;
    }
    #coords:empty { display: none; }

    /* Panneau de recherche */
    #search-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      max-width: calc(100% - 20px);
      box-sizing: border-box;
      padding: 8px 10px;
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      font-size: 13px;
    }
    #search-panel form {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 6px;
    }
    #search-panel label { white-space: nowrap; }
    #search-panel input[type="text"] { width: 100px; min-width: 0; font-size: 13px; }
    #search-panel form[data-layer]:not([data-layer="0"]) input[type="text"] { width: 80px; }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
      flex: none;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    /* Panneau de dessin */
    #draw-panel {
      position: absolute;
      bottom: 40px;
      left: 8px;
      z-index: 3;
      padding: 8px;
      background: var(--panel-bg);
      font-size: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    }
    #draw-panel .row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    #draw-panel button[aria-pressed="true"] { background: #1f2937; color: #fff; }
    #color-palette { display: flex; gap: 3px; margin-bottom: 6px; }
    .color-button {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .35);
      cursor: pointer;
    }
    .color-button[aria-pressed="true"] { border-color: #000; }

    /* Marqueurs */
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, .7);
      transform: translateY(50%); /* centre le point sur sa position */
    }
    .radar-label {
      font-size: 10px;
      line-height: 1;
      padding: 2px 4px;
      color: #003300;
      background: rgba(0, 255, 0, .75);
      border-radius: 3px;
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 14px;
      background: #1f2937;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #toast.visible { opacity: 1; }

    @media (max-width: 600px) {
      #search-panel { font-size: 12px; }
      #search-panel input[type="text"] { width: 70px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="coords"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="search-panel">
    <form data-layer="0">
      <label for="search-string_0">Pseudo joueur</label>
      <span class="swatch"></span>
      <input type="text" id="search-string_0" autocomplete="off">
      <button type="submit">Afficher</button>
      <button type="button" id="radar-button">Radar</button>
    </form>
    <form data-layer="1">
      <label for="search-string_1">TAG Alliance</label>
      <span class="swatch"></span>
      <input type="text" id="search-string_1" autocomplete="off">
      <button type="submit">Afficher</button>
    </form>
    <form data-layer="2">
      <label for="search-string_2">TAG Alliance</label>
      <span class="swatch"></span>
      <input type="text" id="search-string_2" autocomplete="off">
      <button type="submit">Afficher</button>
    </form>
    <form data-layer="3">
      <label for="search-string_3">TAG Alliance</label>
      <span class="swatch"></span>
      <input type="text" id="search-string_3" autocomplete="off">
      <button type="submit">Afficher</button>
    </form>
    <form data-layer="4">
      <label for="search-string_4">TAG Alliance</label>
      <span class="swatch"></span>
      <input type="text" id="search-string_4" autocomplete="off">
      <button type="submit">Afficher</button>
    </form>
    <div class="actions">
      <button type="button" id="heatmap-button">Afficher zones à fort TDC</button>
      <button type="button" id="grid-button">Afficher grille repère</button>
    </div>
  </div>

  <div id="draw-panel">
    <div class="row" id="tools">
      <button type="button" data-tool="marker" aria-pressed="false">Marqueur</button>
      <button type="button" data-tool="polyline" aria-pressed="false">Ligne</button>
      <button type="button" data-tool="polygon" aria-pressed="false">Polygone</button>
      <button type="button" data-tool="rectangle" aria-pressed="false">Rectangle</button>
      <button type="button" data-tool="circle" aria-pressed="false">Cercle</button>
    </div>
    <div id="color-palette"></div>
    <button type="button" id="delete-button">Effacer</button>
  </div>

  <!-- Chargeur officiel de l'API Google Maps (importLibrary). Remplacez YOUR_API_KEY. -->
  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "AIzaSyDEwTVpPn9CHeGQLtKzcUFyxWJLg85P4yQ",
      v: "weekly"
    });
  </script>

  <!-- deck.gl : remplaçant officiel recommandé de google.maps.visualization.HeatmapLayer (supprimé) -->
  <script src="https://unpkg.com/deck.gl@9.1.0/dist.min.js"></script>

  <script type="module">
    /* ============================== CONFIGURATION ============================== */

    const DATA_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTtsRkQuTJkT0toMuifKAAHABr39HCtQILYk_ljXgq6psw8NoKY-lFLNRdGUpWCJ_jv8nAcvK0f0NXrYCJyUH1RzXMNux1IXmj-gOcvFDEu6D1l578XL7yzJVg_8sgvTeiKvbrwXiNQHyXS7gxiCw0Uw8T9l_RbBnf8bJcYhIl6KXbowkSVvlYwDB68SBGiWuySX-31VwPYsWLxvhtKdvF2t3l1K1WT2tdjmR0kisRfQNCAF2btwtOegEUOm0zF0FKwTj3ujHISWpQ2HTu9bcHQSj5EQQ&lib=M2AtAQEBWKBzvbbCACy5Md8IHqNBQ2bpd";

    // Nécessaire pour AdvancedMarkerElement. "DEMO_MAP_ID" convient pour tester ;
    // créez ensuite votre propre Map ID (type Raster si les tuiles S3 ne s'affichent pas).
    const MAP_ID = "DEMO_MAP_ID";

    // Noms de colonnes possibles dans le JSON (insensible à la casse).
    const FIELDS = {
      pseudo:   ["Pseudo", "pseudo", "joueur", "player", "name", "nom"],
      alliance: ["Alliance", "alliance", "tag"],
      y:        ["Y", "lat", "latitude"],
      x:        ["X", "lng", "lon", "longitude"],
      terrain:  ["field", "terrain", "tdc"]
    };

    // Les coordonnées du jeu sont en centièmes de degré (Y=300 -> lat 3.00).
    // Mettez 1 si votre JSON contient déjà des degrés.
    const COORD_DIVISOR = 100;

    // Filtre de la carte de chaleur (ancienne requête Fusion Tables).
    const TERRAIN_MIN = 1_000_000_000;
    const TERRAIN_MAX = 100_000_000_000_000;

    // Tuiles S3 (adresse relative à la racine du site, comme avant).
    const TILE_BASE = "";
    const OVERLAY_IMAGE = "https://i.postimg.cc/VftjXkgM/map.jpg";
    const OVERLAY_BOUNDS = { south: -0.2, west: -0.2, north: 16.2, east: 0.7 };

    // Couleurs : palette de dessin + couleur des 5 recherches.
    const COLORS = ["#32CD32", "#1E90FF", "#fffe1e", "#ff1e20", "#FF8C00"];

    // Les 5 recherches (ex-FusionTablesLayer). "contains" = contient, "exact" = égalité.
    const SEARCH_LAYERS = [
      { field: "pseudo",   match: "exact"    },
      { field: "alliance", match: "contains" },
      { field: "alliance", match: "exact"    },
      { field: "alliance", match: "exact"    },
      { field: "alliance", match: "exact"    }
    ];

    // Radar : nombre de cases -> 1 case = 1112 m, 1 case = 0,01°.
    const RADAR_STEPS = [5, 10, 20, 30, 50, 70, 100, 130, 170, 210, 260, 310];
    const METERS_PER_CASE = 1112;

    /* ============================== BIBLIOTHÈQUES GOOGLE MAPS ============================== */

    const { Map: GoogleMap, InfoWindow } = await google.maps.importLibrary("maps");
    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
    await google.maps.importLibrary("geometry");

    /* ============================== CARTE ============================== */

    const map = new GoogleMap(document.getElementById("map"), {
      mapId: MAP_ID,
      backgroundColor: "#c9ae63",
      center: { lat: 3, lng: 0 },
      zoom: 7,
      minZoom: 7,
      maxZoom: 12,
      zoomControl: true,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: true
    });

    // Type de carte personnalisé (tuiles S3, schéma TMS : l'axe Y est inversé).
    const s3MapType = new google.maps.ImageMapType({
      name: "S3",
      tileSize: new google.maps.Size(256, 256),
      minZoom: 7,
      maxZoom: 12,
      getTileUrl(coord, zoom) {
        const tileRange = 1 << zoom;
        if (coord.y < 0 || coord.y >= tileRange) return null;
        const x = ((coord.x % tileRange) + tileRange) % tileRange;
        return `${TILE_BASE}/${zoom}/${x}/${tileRange - coord.y - 1}.jpg`;
      }
    });
    map.mapTypes.set("S3", s3MapType);
    map.setMapTypeId("S3");

    // Image de fond (remplace l'OverlayView maison par GroundOverlay).
    new google.maps.GroundOverlay(OVERLAY_IMAGE, OVERLAY_BOUNDS, {
      map,
      opacity: 1,
      clickable: false
    });

    /* ============================== UTILITAIRES ============================== */

    const toastEl = document.getElementById("toast");
    let toastTimer;
    function notify(message) {
      toastEl.textContent = message;
      toastEl.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("visible"), 3500);
    }

    // Coordonnées sous la souris
    const coordsDiv = document.getElementById("coords");
    map.controls[google.maps.ControlPosition.TOP_CENTER].push(coordsDiv);

    /* ============================== DONNÉES (JSON) ============================== */

    let rows = [];            // lignes normalisées
    let heatmapPoints = [];   // points pour la carte de chaleur

    function pick(obj, aliases) {
      const keys = Object.keys(obj);
      for (const alias of aliases) {
        const key = keys.find(k => k.toLowerCase() === alias.toLowerCase());
        if (key !== undefined) return obj[key];
      }
      return undefined;
    }

    function toNumber(value) {
      if (typeof value === "number") return value;
      if (typeof value === "string") return Number(value.trim().replace(",", "."));
      return NaN;
    }

    function normalizeRows(json) {
      // Accepte : [ {...} ], { rows|data|values|items: [...] }, ou tableau de tableaux avec en-têtes.
      let list = Array.isArray(json)
        ? json
        : json.rows ?? json.data ?? json.values ?? json.items ?? Object.values(json).find(Array.isArray) ?? [];

      if (list.length && Array.isArray(list[0])) {
        const [header, ...body] = list;
        list = body.map(r => Object.fromEntries(header.map((h, i) => [String(h), r[i]])));
      }

      return list
        .map(o => {
          const y = toNumber(pick(o, FIELDS.y));
          const x = toNumber(pick(o, FIELDS.x));
          return {
            pseudo:   String(pick(o, FIELDS.pseudo) ?? ""),
            alliance: String(pick(o, FIELDS.alliance) ?? ""),
            y, x,
            lat: y / COORD_DIVISOR,
            lng: x / COORD_DIVISOR,
            terrain: toNumber(pick(o, FIELDS.terrain))
          };
        })
        .filter(r => Number.isFinite(r.lat) && Number.isFinite(r.lng));
    }

    async function loadData() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        rows = normalizeRows(await response.json());

        heatmapPoints = rows
          .filter(r => r.terrain >= TERRAIN_MIN && r.terrain <= TERRAIN_MAX)
          .map(r => ({ position: [r.lng, r.lat], weight: r.terrain }));

        if (!rows.length) notify("Le fichier JSON ne contient aucune ligne exploitable.");
      } catch (error) {
        console.error("Chargement des données impossible :", error);
        notify("Impossible de charger les données (voir la console).");
      }
    }

    /* ============================== RECHERCHES (ex-Fusion Tables) ============================== */

    const infoWindow = new InfoWindow();
    const layerMarkers = SEARCH_LAYERS.map(() => []);

    function matches(value, query, mode) {
      const v = value.toLowerCase().trim();
      const q = query.toLowerCase().trim();
      return mode === "contains" ? v.includes(q) : v === q;
    }

    function makeDot(color) {
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.background = color;
      return dot;
    }

    function popupContent(row) {
      const box = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = row.pseudo || "(sans pseudo)";
      box.append(title);
      const lines = [
        row.alliance && `Alliance : ${row.alliance}`,
        `Y=${row.y}  X=${row.x}`,
        Number.isFinite(row.terrain) && `TDC : ${row.terrain.toLocaleString("fr-FR")}`
      ].filter(Boolean);
      for (const text of lines) {
        box.append(document.createElement("br"), document.createTextNode(text));
      }
      return box;
    }

    function clearLayer(index) {
      layerMarkers[index].forEach(m => { m.map = null; });
      layerMarkers[index] = [];
    }

    function showLayer(index, query) {
      clearLayer(index);
      const { field, match } = SEARCH_LAYERS[index];
      const found = rows.filter(r => matches(r[field], query, match));

      layerMarkers[index] = found.map(row => {
        const marker = new AdvancedMarkerElement({
          map,
          position: { lat: row.lat, lng: row.lng },
          content: makeDot(COLORS[index]),
          gmpClickable: true
        });
        marker.addEventListener("gmp-click", () => {
          infoWindow.setContent(popupContent(row));
          infoWindow.open({ anchor: marker, map });
        });
        return marker;
      });
      return found;
    }

    function searchPlayer() {
      const query = document.getElementById("search-string_0").value;
      if (!query.trim()) { clearLayer(0); return; }
      const found = showLayer(0, query);
      if (!found.length) { notify("Aucun joueur trouvé."); return; }
      const { lat, lng } = found[0];
      map.setCenter({ lat, lng });
      map.setZoom(11);
      updateRadar(lat, lng);
    }

    function searchAlliance(index) {
      const query = document.getElementById(`search-string_${index}`).value;
      if (!query.trim()) { clearLayer(index); return; }
      const found = showLayer(index, query);
      if (!found.length) { notify("Aucune alliance trouvée."); return; }
      map.setCenter({ lat: 3, lng: 0.25 });
      map.setZoom(7);
    }

    document.querySelectorAll("form[data-layer]").forEach(form => {
      const index = Number(form.dataset.layer);
      form.querySelector(".swatch").style.background = COLORS[index];
      form.addEventListener("submit", event => {
        event.preventDefault();
        index === 0 ? searchPlayer() : searchAlliance(index);
      });
    });

    /* ============================== CARTE DE CHALEUR (deck.gl) ============================== */

    let heatmapOverlay = null;
    let heatmapVisible = false;

    function toggleHeatmap() {
      if (!window.deck?.GoogleMapsOverlay) {
        notify("La bibliothèque deck.gl n'a pas pu être chargée.");
        return;
      }
      if (!heatmapPoints.length) {
        notify("Aucune donnée de terrain pour la carte de chaleur.");
        return;
      }
      heatmapVisible = !heatmapVisible;
      if (!heatmapOverlay) {
        heatmapOverlay = new deck.GoogleMapsOverlay({ layers: [] });
        heatmapOverlay.setMap(map);
      }
      heatmapOverlay.setProps({
        layers: heatmapVisible
          ? [new deck.HeatmapLayer({
              id: "tdc-heatmap",
              data: heatmapPoints,
              getPosition: d => d.position,
              getWeight: d => d.weight,
              radiusPixels: 15,
              opacity: 0.5
            })]
          : []
      });
    }
    document.getElementById("heatmap-button").addEventListener("click", toggleHeatmap);

    /* ============================== GRILLE REPÈRE ============================== */

    const gridLines = [];

    function buildGrid() {
      const gray = { clickable: false, strokeColor: "#00000F", strokeOpacity: 0.3, strokeWeight: 0.5 };
      const red  = { clickable: false, strokeColor: "red", strokeOpacity: 0.5 };
      const arrow = [{ icon: { path: google.maps.SymbolPath.FORWARD_OPEN_ARROW }, offset: "100%" }];

      // Axes fléchés
      gridLines.push(
        new google.maps.Polyline({ ...red, strokeWeight: 2, icons: arrow, path: [{ lat: 0, lng: 0 }, { lat: 0, lng: 1.5 }] }),
        new google.maps.Polyline({ ...red, strokeWeight: 2, icons: arrow, path: [{ lat: 0, lng: 0 }, { lat: 17.5, lng: 0 }] }),
        // Lignes rouges (limites)
        new google.maps.Polyline({ ...red, strokeWeight: 1, path: [{ lat: 16, lng: 0 }, { lat: 16, lng: 0.5 }] }),
        new google.maps.Polyline({ ...red, strokeWeight: 1, path: [{ lat: 0, lng: 0.5 }, { lat: 16, lng: 0.5 }] })
      );

      // Lignes verticales : une par centième de degré, tracées en "serpentin"
      const vertical = [];
      for (let i = 1; i <= 49; i++) {
        const lng = i / 100;
        const [from, to] = i % 2 ? [0, 16] : [16, 0];
        vertical.push({ lat: from, lng }, { lat: to, lng });
      }
      gridLines.push(new google.maps.Polyline({ ...gray, path: vertical }));

      // Lignes horizontales
      const horizontal = [];
      for (let i = 1; i <= 1600; i++) {
        const lat = i / 100;
        const [from, to] = i % 2 ? [0, 0.5] : [0.5, 0];
        horizontal.push({ lat, lng: from }, { lat, lng: to });
      }
      gridLines.push(new google.maps.Polyline({ ...gray, path: horizontal }));
    }

    let gridVisible = false;
    document.getElementById("grid-button").addEventListener("click", () => {
      if (!gridLines.length) buildGrid();
      gridVisible = !gridVisible;
      gridLines.forEach(line => line.setMap(gridVisible ? map : null));
    });

    /* ============================== RADAR ============================== */

    const radarShapes = [];   // cercles + lignes
    const radarMarkers = [];  // étiquettes nord / sud
    const radarCircles = [];
    let radarLines = [];
    let radarCenter = null;
    let radarVisible = false;

    (function buildRadar() {
      const green = { clickable: false, strokeColor: "#00ff00", strokeOpacity: 0.5, strokeWeight: 0.5 };

      for (const n of RADAR_STEPS) {
        const circle = new google.maps.Circle({
          ...green,
          fillOpacity: 0.03,
          radius: n * METERS_PER_CASE
        });
        radarCircles.push(circle);
        radarShapes.push(circle);
      }

      radarLines = [
        new google.maps.Polyline({ ...green }),
        new google.maps.Polyline({ ...green, strokeWeight: 1 }),
        new google.maps.Polyline({ ...green }),
        new google.maps.Polyline({ ...green })
      ];
      radarShapes.push(...radarLines);

      for (const n of RADAR_STEPS) {
        for (const sign of [1, -1]) {
          const label = document.createElement("div");
          label.className = "radar-label";
          label.textContent = n;
          radarMarkers.push({
            offset: sign * n / 100,
            marker: new AdvancedMarkerElement({ content: label, gmpClickable: false })
          });
        }
      }
    })();

    function applyRadarVisibility() {
      const target = radarVisible && radarCenter ? map : null;
      radarShapes.forEach(s => s.setMap(target));
      radarMarkers.forEach(({ marker }) => { marker.map = target; });
    }

    function updateRadar(lat, lng) {
      radarCenter = { lat, lng };
      radarCircles.forEach(c => c.setCenter(radarCenter));

      const R = 3.096;
      const D = 2.192031021678297;
      radarLines[0].setPath([{ lat, lng: lng - R }, { lat, lng: lng + R }]);
      radarLines[1].setPath([{ lat: lat - R, lng }, { lat: lat + R, lng }]);
      radarLines[2].setPath([{ lat: lat - D, lng: lng - D }, { lat: lat + D, lng: lng + D }]);
      radarLines[3].setPath([{ lat: lat + D, lng: lng - D }, { lat: lat - D, lng: lng + D }]);

      radarMarkers.forEach(({ marker, offset }) => {
        marker.position = { lat: lat + offset, lng };
      });
      applyRadarVisibility();
    }

    document.getElementById("radar-button").addEventListener("click", () => {
      if (!radarCenter) { notify("Recherchez d'abord un joueur pour afficher son radar."); return; }
      radarVisible = !radarVisible;
      applyRadarVisibility();
    });

    /* ============================== OUTILS DE DESSIN (remplace DrawingManager) ============================== */

    let tool = null;          // 'marker' | 'polyline' | 'polygon' | 'rectangle' | 'circle' | null
    let draft = null;         // forme en cours de tracé
    let selectedShape = null;
    let selectedColor = COLORS[0];

    const toolButtons = document.querySelectorAll("#tools button");
    const colorButtons = {};

    function shapeOptions(type) {
      if (type === "polyline") {
        return { strokeColor: selectedColor, strokeWeight: 3, clickable: false };
      }
      return { fillColor: selectedColor, fillOpacity: 0.45, strokeColor: selectedColor, strokeWeight: 1, clickable: false };
    }

    function setTool(next) {
      cancelDraft();
      clearSelection();
      tool = next;
      toolButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === tool)));
      map.setOptions({
        draggableCursor: tool ? "crosshair" : null,
        disableDoubleClickZoom: tool === "polyline" || tool === "polygon"
      });
    }

    function cancelDraft() {
      if (draft) {
        draft.shape.setMap(null);
        draft = null;
      }
    }

    function clearSelection() {
      if (selectedShape && selectedShape.type !== "marker") selectedShape.setEditable(false);
      selectedShape = null;
    }

    function setSelection(shape) {
      clearSelection();
      if (shape.type !== "marker") {
        shape.setEditable(true);
        selectColor(shape.get("fillColor") || shape.get("strokeColor"));
      }
      selectedShape = shape;
    }

    function removeShape(shape) {
      if (shape.type === "marker") shape.map = null;
      else shape.setMap(null);
      if (selectedShape === shape) selectedShape = null;
    }

    function selectColor(color) {
      selectedColor = color;
      for (const [c, button] of Object.entries(colorButtons)) {
        button.setAttribute("aria-pressed", String(c === color));
      }
    }

    function setSelectedShapeColor(color) {
      if (!selectedShape || selectedShape.type === "marker") return;
      if (selectedShape.type === "polyline") selectedShape.set("strokeColor", color);
      else selectedShape.setOptions({ fillColor: color, strokeColor: color });
    }

    function buildColorPalette() {
      const palette = document.getElementById("color-palette");
      for (const color of COLORS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "color-button";
        button.style.backgroundColor = color;
        button.setAttribute("aria-label", `Couleur ${color}`);
        button.addEventListener("click", () => {
          selectColor(color);
          setSelectedShapeColor(color);
        });
        palette.append(button);
        colorButtons[color] = button;
      }
      selectColor(COLORS[0]);
    }

    function finalizeShape(shape, type) {
      shape.type = type;
      shape.setOptions({
        clickable: true,
        editable: true,
        draggable: true,
        ...(type !== "polyline" && { strokeWeight: 0 })
      });

      shape.addListener("click", event => {
        if (event.vertex !== undefined) {
          // Un clic sur un sommet le supprime
          if (type === "polygon") {
            const path = shape.getPaths().getAt(event.path);
            path.removeAt(event.vertex);
            if (path.getLength() < 3) { removeShape(shape); return; }
          } else if (type === "polyline") {
            const path = shape.getPath();
            path.removeAt(event.vertex);
            if (path.getLength() < 2) { removeShape(shape); return; }
          }
        }
        setSelection(shape);
      });

      draft = null;
      setTool(null);
      setSelection(shape);
    }

    function finishPath() {
      if (!draft || !["polyline", "polygon"].includes(draft.type)) return;
      const path = draft.shape.getPath();
      path.pop(); // point "curseur" de fin
      const n = path.getLength();
      // Le double-clic ajoute un doublon : on le retire
      if (n >= 2 && path.getAt(n - 1).equals(path.getAt(n - 2))) path.pop();
      const min = draft.type === "polygon" ? 3 : 2;
      if (path.getLength() < min) { cancelDraft(); return; }
      finalizeShape(draft.shape, draft.type);
    }

    function handleDrawClick(latLng) {
      switch (tool) {
        case "marker": {
          const marker = new AdvancedMarkerElement({
            map,
            position: latLng,
            gmpDraggable: true,
            gmpClickable: true
          });
          marker.type = "marker";
          marker.addEventListener("gmp-click", () => setSelection(marker));
          setSelection(marker);
          break; // le mode marqueur reste actif, comme avant
        }
        case "polyline":
        case "polygon": {
          if (!draft) {
            const shape = tool === "polygon"
              ? new google.maps.Polygon({ ...shapeOptions("polygon"), map, paths: [[latLng, latLng]] })
              : new google.maps.Polyline({ ...shapeOptions("polyline"), map, path: [latLng, latLng] });
            draft = { type: tool, shape };
          } else {
            const path = draft.shape.getPath();
            path.setAt(path.getLength() - 1, latLng);
            path.push(latLng);
          }
          break;
        }
        case "rectangle": {
          if (!draft) {
            const shape = new google.maps.Rectangle({
              ...shapeOptions("rectangle"),
              map,
              bounds: new google.maps.LatLngBounds(latLng, latLng)
            });
            draft = { type: "rectangle", shape, origin: latLng };
          } else {
            const b = draft.shape.getBounds();
            if (b.getSouthWest().equals(b.getNorthEast())) { cancelDraft(); return; }
            finalizeShape(draft.shape, "rectangle");
          }
          break;
        }
        case "circle": {
          if (!draft) {
            const shape = new google.maps.Circle({ ...shapeOptions("circle"), map, center: latLng, radius: 0 });
            draft = { type: "circle", shape, origin: latLng };
          } else {
            if (draft.shape.getRadius() <= 0) { cancelDraft(); return; }
            finalizeShape(draft.shape, "circle");
          }
          break;
        }
      }
    }

    function updateDraft(latLng) {
      if (!draft) return;
      switch (draft.type) {
        case "polyline":
        case "polygon": {
          const path = draft.shape.getPath();
          path.setAt(path.getLength() - 1, latLng);
          break;
        }
        case "rectangle":
          draft.shape.setBounds(new google.maps.LatLngBounds().extend(draft.origin).extend(latLng));
          break;
        case "circle":
          draft.shape.setRadius(google.maps.geometry.spherical.computeDistanceBetween(draft.origin, latLng));
          break;
      }
    }

    toolButtons.forEach(button => {
      button.addEventListener("click", () => setTool(tool === button.dataset.tool ? null : button.dataset.tool));
    });
    document.getElementById("delete-button").addEventListener("click", () => {
      if (selectedShape) removeShape(selectedShape);
    });

    map.addListener("click", event => {
      if (tool) handleDrawClick(event.latLng);
      else clearSelection();
    });
    map.addListener("dblclick", finishPath);
    map.addListener("mousemove", event => {
      coordsDiv.textContent =
        `Y=${Math.round(event.latLng.lat() * 100)} et X=${Math.round(event.latLng.lng() * 100)}`;
      updateDraft(event.latLng);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setTool(null);
      if (event.key === "Enter") finishPath();
    });

    buildColorPalette();

    /* ============================== DÉMARRAGE ============================== */

    await loadData();
  </script>
</body>
</html>
